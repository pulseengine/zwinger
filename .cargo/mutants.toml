# cargo-mutants settings. CI (mutants job) runs src/profile.rs, src/linux.rs and src/macos.rs with
# zero missed mutants allowed (REQ-ZW-002, REQ-ZW-005, REQ-ZW-003).

exclude_re = [
    # Equivalent mutants: RET_ERRNO and the errno value occupy disjoint bits, so `|` and `^`
    # build the same seccomp return value. No test can tell them apart.
    'replace \| with \^ in seccomp_(program|spec)',
    # Equivalent mutant: O_PATH and O_NOFOLLOW are disjoint bits, so `|` and `^` give the same
    # open flags in open_planned.
    'replace \| with \^ in open_planned',
    # Kani-only code (cfg(kani)): unit tests never compile it, so cargo-mutants cannot judge it.
    # Its potency is checked inside Kani by the planted-bug controls, which must each fail.
    'proofs::',
    'Program::as_mut_slice',
    # Not mutation-gated: the kernel-facing half. Its refusal branches (a kernel without
    # Landlock, a ruleset not fully enforced, a failing close_range or seccomp call) cannot be
    # reached on a CI kernel that has the features. What it does enforce is checked end to end
    # by tests/linux.rs; its decisions come from the planner, which is gated.
    '\bconfine\b',
    '\bkernel_abi\b',
    # The same for macOS: `macos::confine` (matched above) and `macos::enforce`, the calls into
    # libSystem (sandbox_init, fcntl). They are cfg(target_os = "macos"), so the Linux mutants job
    # does not even compile them; tests/macos.rs checks what they enforce on the macOS runner,
    # including that inherited descriptors do not leak. Their input, the policy, is gated.
    '\benforce::',
]
