  - id: REQ-ZW-021
    type: requirement
    title: "The confined command receives its plan in ZWINGER_GRANTS"
    status: approved
    links:
      - type: constraint-satisfies
        target: SC-ZW-11
      - type: constraint-satisfies
        target: SC-ZW-15
    description: >
      Every command zwinger runs gets ZWINGER_GRANTS, JSON with schema zwinger.grants.v1: the
      resolved read and write grants, deny_read, deny_write and noexec, and exec (empty until
      the exec allowlist exists). Paths are absolute. A plan JSON cannot carry (a path that is
      not UTF-8) is refused before exec. The variable is information for the command, such as
      kapsel's preopens or an agent explaining a denial; the kernel sandbox enforces the same
      plan whether or not it is read.

  - id: DD-ZW-020
    type: design-decision
    title: "The plan reaches the command as one JSON environment variable, set for every command"
    status: approved
    description: >
      Adopted in kapsel's seam (kapsel#140) and by the owner, 2026-11-27.
    decision: >
      src/grants.rs builds the value from each backend's plan (linux::session_grants,
      macos::session_grants), and run sets it with ZWINGER_PROFILE. It is set for every
      command, not only kapsel.
    rationale: >
      An environment variable is the channel zwinger already uses, needs no parser beyond JSON
      in the reader, and carries the plan after zwinger has resolved and checked it, so a reader
      never re-derives paths from the profile.
    links:
      - type: satisfies
        target: REQ-ZW-021

