        target: REQ-ZW-023

  - id: REQ-ZW-024
    type: requirement
    title: "zwinger refuses a profile or zwinger executable that resolves inside a write grant"
    status: approved
    description: >
      check and run refuse (exit 78, and run writes a refusal record) when the profile file or
