  - id: REQ-ZW-017
    type: requirement
    title: "A profile's network peers are generated from the architecture model"
    status: draft
    links:
      - type: constraint-satisfies
        target: SC-ZW-10
    description: >
      A converter outside the zwinger binary reads spar's instance of a deployment and emits,
      per node, a YAML fragment with the peers that node's sessions connect to. A profile takes
      its network section from that fragment; CI regenerates the fragment and fails on a diff.
      zwinger itself never parses AADL. Waits for the egress design (zwinger#14), which decides
      what the peers become in enforcement.

  - id: REQ-ZW-018
    type: requirement
    title: "The session lifecycle is modelled as modes and checked: no confinement without preflight"
    status: approved
    description: >
      The session component carries AADL modes loading, preflight, confined, refused and
      exited, driven by the launcher (the zwinger process before exec). CI fails when spar
      reports a dead transition, when any transition leaves refused or exited, or when confined
      is entered from any mode but preflight. This mirrors main.rs: run confines only after
      preflight (plan, ABI, enforcement) succeeds, and a refusal exits 78 without exec.
    links:
      - type: refines
        target: REQ-ZW-001

  - id: DD-ZW-011
    type: design-decision
    title: "The model reaches profiles as a generated fragment; zwinger never parses AADL"
    status: approved
    description: >
      Owner decision, 2026-11-27, from four options: spar emits a fragment, spar emits whole
      profiles, zwinger reads AADL, or a check only.
    decision: >
      spar's instance model is the source for a session's network section. spar itself writes
      it, as `spar emit --format zwinger-profile` with rivet-yaml (seam zwinger#17), from the
      Zwinger_Profile property set (architecture/zwinger_profile.aadl) and the hosts reached
      through the session's egress feature. The filesystem rules and mach_lookup stay
      hand-written in the profile. architecture/expected/ holds the fragments the reference
      mesh must produce; tests/architecture.rs parses them as profiles and ties their hosts to
      the model, and once the emitter is released and pinned, CI diffs its output against them.
    rationale: >
      Everything zwinger parses runs before confinement and is trusted; an AADL parser there
      would grow that base for no runtime benefit. Generating the peers removes the drift a
      check-only gate would police, and AADL is a poor fit for path rules, so whole-profile
      generation would make the model harder to read.
    links:
      - type: satisfies
        target: REQ-ZW-017

  - id: DD-ZW-012
    type: design-decision
    title: "zwinger publishes the component type and a reference mesh; deployments stay with their owner"
    status: approved
    description: >
      Owner decision, 2026-11-27: smithy deploys, but anyone must be able to do the same.
    decision: >
      Package Zwinger (architecture/zwinger.aadl) is the reusable component type: a session
      with its kernel, profiles, host resources and warte probe, and their error model.
      Package Zwinger_Reference_Mesh is a public two-node template (an agent node on a Mac, a
      device node on a Pi, warte on the agent's host) analysed in zwinger's CI. smithy's fleet
      model imports package Zwinger and binds it to its real hosts in its own repository.
    rationale: >
      zwinger is public and host names stay private, so the real fleet cannot live here. A
      type with no worked instance would leave each deployer to discover the binding alone; the
      reference mesh is that instance, and CI keeps it analysable.
    links:
      - type: satisfies
        target: REQ-ZW-016

  - id: DD-ZW-013
    type: design-decision
    title: "The error model states two top events: fail-closed confinement and silent event loss"
    status: approved
    description: >
      Owner decision, 2026-11-27, over fail-closed only and a full mesh failure model.
    decision: >
      Faults reaching a session (a malformed profile, a kernel without the sandbox, an ABI too
      old) end in error sinks, which are refusals with exit 78, and no session declares an
      ItemCommission on what the command does to its host. A run that writes no event is an
      error source on events_out; the probe passes it on as an omission, because it cannot
      tell a missing event from no run, and the chain ends at warte. CI pins that chain as a
      known gap: closing it (a run counter or a start record) flips the check, and this
      decision is updated with it.
    rationale: >
      The model states the fail-closed claim and the Kani and Verus proofs carry the evidence
      (VER-ZW-005, VER-ZW-006). spar 0.49.0's propagation pass ignores sinks and paths
      (spar#669), so it over-approximates where an error can travel: an absence it reports is
      real, which is the direction the fail-closed check needs. That holds only while nothing
      else in the pass under-approximates; re-check it when spar#669 lands, because honouring
      sinks makes the pass less conservative. Its fault-tree pass is structural only and does
      not read the annexes, so the gate does not use it. Carrier faults, relay hops and a
      compromised peer wait for the channel (zwinger#10), which does not exist yet.
    links:
      - type: satisfies
        target: REQ-ZW-016

  - id: DD-ZW-014
    type: design-decision
    title: "Event timing is bounded with network calculus on the LAN, under stated assumptions"
    status: approved
    description: >
      Owner decision, 2026-11-27: include WCTT now rather than after the channel exists.
    decision: >
      spar's WCTT pass bounds the Pi's event stream to warte in the reference mesh. The rates
      (100 Mbit/s NICs, a 1 Gbit/s FIFO switch), the 2 to 10 us forwarding latency and the
      queue depths are written in the model as assumptions. CI requires a bound to exist and to
      stay under 1 ms; the computed bound is 34.144 us over one hop.
    rationale: >
      Events are not real-time, so the budget is there to catch a model change that loses the
      bound or inflates it, not to promise a deadline. Over WireGuard on the internet a network
      calculus bound would be meaningless, so the analysis covers the LAN only. The bound does
      not include serialising a frame onto the sender's 100 Mbit/s access link (about 120 us
      for 1500 bytes); that question is raised with spar, and the bound is not quoted as a
      delivery guarantee.
    links:
      - type: satisfies
        target: REQ-ZW-016

  - id: DD-ZW-015
    type: design-decision
    title: "Behavior zwinger supervises is modelled in spar: AADL modes now, the Behavior Annex when spar checks it"
    status: approved
    description: >
      Owner direction, 2026-11-27: use spar for any behavior zwinger models and supervises.
      Shape agreed with the spar session, checked against spar main 8bef917.
    decision: >
      Lifecycles are AADL modes with event-port triggers, checked by spar modes (reachability,
      dead transitions, the SMV transition relation) in the architecture gate. Exit codes are
      data, not modes. Triggers are ports from a sibling component, because spar 0.49.0 does not
      resolve subcomponent.port triggers (spar#670). The gate reads the SMV transition relation
      and the dead-transition list, not spar's reachability summary, which #670 found to
      disagree with the dead-transition list. Runtime supervision (observed peers and events against
      declared connections) and generated profile fragments read spar's output from outside the
      zwinger binary, pinned to one spar version, failing on any missing key.
    rationale: >
      spar parses the Behavior Annex but no pass checks it (spar#671), so BA states would be
      unchecked prose; modes are checked today and export to NuSMV. spar insight compares CTF timing, not
      connections or event presence, and trace-topology has no CLI or JSON event input yet
      (spar#672), so zwinger does not reshape its events to fit either. The instance JSON has no schema version (spar#673) and
      diagnostics carry no structured fields (spar#674), so the pin, a loud converter and
      planted models carry the contract until spar provides one.
    links:
      - type: satisfies
        target: REQ-ZW-018
      - type: satisfies
        target: REQ-ZW-023
      - type: satisfies
        target: REQ-ZW-016

