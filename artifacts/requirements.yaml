artifacts:
  - id: REQ-ZW-001
    type: requirement
    title: "zwinger fails closed: it never starts a session unconfined"
    status: approved
    description: >
      A missing, unreadable or malformed profile, an unknown or duplicate key, an empty or null name, a relative or
      '..' path, a contradictory pair of path entries, a host that is not an exact name, a
      malformed Mach service name, a profile the platform backend cannot enforce as written, or
      the absence of an enforcement backend refuses the session with exit 78. Nothing falls back
      to "allow".
    fields:
      origin: "design goal: a session is never unconfined by accident"

  - id: REQ-ZW-002
    type: requirement
    title: "One typed per-session profile drives every platform"
    status: approved
    description: >
      A YAML profile, read by rivet-yaml (name, read, write, deny_read, deny_write, network.allow,
      network.allow_local_binding, mach_lookup) with unknown or duplicate keys and wrong types rejected and
      every field refusable; the same file is enforced on macOS and Linux. The fields follow what
      the sandbox profiles in use today express: read and write allow lists, denied paths inside
      them, an egress host list, loopback binding and Mach lookups.

  - id: REQ-ZW-003
    type: requirement
    title: "macOS: enforcement through an Endpoint Security descendants client"
    status: draft
    description: >
      Confine the session's process tree with es_new_descendants_client (macOS 27) instead of the
      deprecated sandbox-exec, covering file, exec and network events of every descendant. Subject
      to the spike and Apple granting the ES entitlement.

  - id: REQ-ZW-004
    type: requirement
    title: "Linux: the filesystem part of the profile is enforced through Landlock"
    status: approved
    description: >
      zwinger run on Linux restricts itself with a Landlock ruleset (read trees: read and
      execute; write trees: every filesystem right) and then execs the session, so the session and
      every descendant inherit it. Below Landlock ABI 3 (Linux 6.2), which cannot restrict
      truncate(2), it refuses with exit 78. The ruleset must report fully enforced and
      no_new_privs must be set, or it refuses. Inherited descriptors above 2 are closed on exec.

  - id: REQ-ZW-005
    type: requirement
    title: "Linux: no egress, and network allowances Landlock cannot express are refused"
    status: approved
    description: >
      network.mode = "none" (the default) means no egress: a seccomp filter fails socket(2) with
      EACCES for every family except AF_UNIX and fails io_uring with EPERM; where the ABI has them, Landlock
      also denies TCP (ABI 4) and UDP (ABI 10). A foreign syscall ABI (i386 on x86_64) kills the
      process and x32 calls fail with EPERM. A non-empty network.allow or allow_local_binding = true is
      refused, because Landlock filters ports, not hosts or addresses, and the backend has no
      filtering proxy.

  - id: REQ-ZW-006
    type: requirement
    title: "Linux: UNIX sockets and the inherited terminal cannot reach outside the session"
    status: approved
    description: >
      socket(AF_UNIX) is allowed only when Landlock confines where it can connect: pathname
      sockets through ResolveUnix (ABI 9) granted on write trees only, abstract sockets and
      signals through scoping (ABI 6). On older kernels socket(AF_UNIX) fails with EACCES;
      socketpair(2) stays available. ioctl(2) with TIOCSTI or TIOCLINUX fails with EPERM on
      every fd, because fds 0-2 may be the caller's terminal and pushing input into it would run
      commands in the unconfined shell after the session exits.

  - id: REQ-ZW-007
    type: requirement
    title: "Raspberry Pi: the Linux backend is checked on a Raspberry Pi 5 kernel"
    status: draft
    description: >
      The aarch64 seccomp table and the Landlock tests run on a Raspberry Pi 5 kernel. CI covers
      a hosted aarch64 runner today, which is not a Pi kernel.

  - id: REQ-ZW-008
    type: requirement
    title: "A backend refuses a profile it cannot enforce as written"
    status: approved
    description: >
      On Linux: a granted (read or write) path that does not exist, a deny_read inside a granted
      tree or a deny_write inside a write tree (Landlock cannot carve a subtree out of a granted
      one), and a granted path that resolves through a symlink into a denied tree are refused
      with exit 78 before anything runs. Paths are compared after resolving symlinks, including
      above denied paths that do not exist yet.

  - id: REQ-ZW-009
    type: requirement
    title: "Allowances the backend cannot confine are stated explicitly and named at startup"
    status: approved
    description: >
      network.mode = "unfiltered" allows every socket family but AF_UNIX and sets no network
      rules; network.unix_sockets = "unfiltered" allows socket(AF_UNIX) on every ABI and drops
      Landlock's UNIX confinement (ResolveUnix, abstract-socket scoping). Neither is a default,
      neither combines with network.allow or allow_local_binding, and an unknown value is
      refused. read_if_present and write_if_present grants are skipped when the path does not
      exist, follow every rule of read and write otherwise, and are listed as skipped at startup.

  - id: REQ-ZW-010
    type: requirement
    title: "A denial can be traced to the profile"
    status: approved
    description: >
      zwinger run writes one startup line to stderr naming the profile, the Landlock ABI
      applied, the grant counts, skipped optional paths, the network and UNIX-socket modes,
      whether denials are audit-logged and what the profile leaves unconfined on this kernel. The
      session gets ZWINGER_PROFILE and ZWINGER_ABI in its environment. On ABI 7 and later
      Landlock logs denials after the exec (log_new_exec). zwinger explain PROFILE PATH|tcp:PORT
      answers whether the Linux backend allows an access and names the grant that decides it.

  - id: REQ-ZW-011
    type: requirement
    title: "A template profile confines a self-hosted GitHub Actions runner"
    status: approved
    description: >
      profiles/github-runner.yaml confines a runner's paths with {{home}} as its only
      placeholder: system trees and the home read-only, work, temp, log and cache directories
      writable, the network unfiltered. Unsubstituted, it fails zwinger check. The runner's home
      is not writable, so a job cannot replace the runner binaries for later jobs.

  - id: REQ-ZW-012
    type: requirement
    title: "Releases are signed static Linux binaries a consumer can pin by sha256"
    status: approved
    description: >
      A v* tag whose name matches Cargo.toml publishes static musl archives for x86_64 and
      aarch64 Linux, a CycloneDX SBOM and a docs archive, all listed in one SHA256SUMS.txt
      signed with cosign keyless under the release.yml identity, with SLSA build provenance on
      the archives. Each packaged binary is checked before upload: no dynamic loader or shared
      library, --version equal to the tag, and it confines a process on the build runner's
      kernel. The command line follows the pulseengine CLI conventions (--version and -V print
      "zwinger SEMVER", --help exits 0, an unknown flag or command exits 2).

  - id: REQ-ZW-013
    type: requirement
    title: "Execution can be refused in trees the session may read or write"
    status: approved
    description: >
      A profile's noexec list names trees nothing may be executed from (a scratch or download
      directory), so a session cannot write a program and then run it there. On Linux every
      grant at or beneath a noexec tree is given to Landlock without the execute right, and a
      noexec tree strictly inside a wider grant is refused, because that grant's execute right
      would still cover it. execve of a file beneath the tree then fails with EACCES. Not
      covered: code run without execve, by an interpreter reading a script (sh script) or by the
      dynamic loader mapping a binary (ld.so binary), which Landlock does not see.
  - id: REQ-ZW-014
    type: requirement
    title: "Each run reports its confinement to warte, without paths"
    status: approved
    description: >
      Every zwinger run writes one versioned event (schema zwinger.event.v1) for warte's probe.
      It carries the profile name and sha256, the verdict, a refusal category (profile, path,
      carve-out, noexec, network, kernel, backend), the Landlock ABI, the network mode, the
      not-enforced list and grant counts, and no path, argument or command line. The file is
      opened before the session is confined, so the session needs no grant for the events
      directory. When a write grant covers the events directory, no event is written and stderr
      says why, because the session could forge or delete events there and Landlock cannot carve
      the directory out of the grant. Writing events never changes whether a session is confined
      or refused: a failure is reported on stderr. ZWINGER_EVENTS_DIR overrides the
      directory (empty turns events off). The default is $XDG_STATE_HOME/warte/zwinger, else
      ~/.local/state/warte/zwinger.

  - id: DD-ZW-001
    type: design-decision
    title: "A Rust launcher with typed profiles that refuses when unsure"
    status: approved
    description: >
      zwinger replaces the zsh launchers (pe-agent-run) with one Rust binary that parses a typed
      profile and refuses on any doubt; platform backends plug in behind it.
    decision: >
      Profile parsing rejects unknown keys and unsafe values; run refuses until a backend exists.
    rationale: >
      Shell launchers make fail-open paths easy to miss; typed parsing and an explicit refusal path
      make "unconfined by accident" a test failure instead of a silent default.
    links:
      - type: satisfies
        target: REQ-ZW-001
      - type: satisfies
        target: REQ-ZW-002

  - id: DD-ZW-002
    type: design-decision
    title: "Backends: Endpoint Security descendants on macOS, Landlock + seccomp on Linux"
    status: proposed
    description: >
      macOS uses es_new_descendants_client through a small C bridge (bridge/); Linux uses Landlock
      and seccomp. Both are supported, documented OS mechanisms, unlike sandbox-exec.
    decision: >
      Spike the macOS bridge on a SIP-disabled macOS 27 VM before building it.
    rationale: >
      Apple calls the Seatbelt profile language "not API"; ES and Landlock are the supported paths.
    links:
      - type: satisfies
        target: REQ-ZW-003
      - type: satisfies
        target: REQ-ZW-004
      - type: satisfies
        target: REQ-ZW-007

  - id: DD-ZW-003
    type: design-decision
    title: "Linux: decide from the kernel's Landlock ABI, tighten rather than degrade"
    status: approved
    description: >
      The Linux backend reads the kernel's Landlock ABI once and builds a ruleset that handles
      every right of that ABI under the crate's HardRequirement level, never best effort. Where
      an older ABI leaves a channel open that the profile closes, the backend either refuses (ABI
      below 3) or closes the channel with seccomp (all non-UNIX sockets, io_uring, and AF_UNIX
      below ABI 9). The seccomp program is a classic-BPF filter of at most 20 instructions written out in
      src/linux.rs and run through an interpreter in its unit tests on every platform.
    decision: >
      Landlock (landlock crate 0.4.8) for paths and ports; a hand-written seccomp filter for
      socket families and io_uring; refuse host allow lists, loopback binding and carve-outs.
    rationale: >
      A best-effort ruleset reports "partially enforced" where the profile promised a closed
      channel, which is a fail-open path. A hand-written filter keeps the whole program
      reviewable and testable without a kernel. Known gaps that remain, stated here so they are
      not mistaken for coverage: Landlock does not restrict chmod, chown, utime or xattr changes
      on paths outside the granted trees; the syscall numbers and constants in src/linux.rs are
      shared by the program and its Kani spec, so the proofs cannot catch a wrong number (they
      were checked against the Linux UAPI headers in review, and tests/linux.rs runs the filter
      in real kernels); below ABI 6 signals to processes outside the session
      are not scoped; below ABI 5 device ioctls are not restricted; host-level egress filtering
      needs a proxy that does not exist yet; paths are checked and then opened in two steps,
      which only a process already unconfined as the same user could race. The terminal
      injection ioctls are not covered end to end: on a terminal that is not the caller's
      controlling one the kernel itself returns EPERM, so a probe cannot tell the two apart.
    links:
      - type: satisfies
        target: REQ-ZW-004
      - type: satisfies
        target: REQ-ZW-005
      - type: satisfies
        target: REQ-ZW-006
      - type: satisfies
        target: REQ-ZW-008

  - id: DD-ZW-004
    type: design-decision
    title: "CI runners: confine paths, leave the network unfiltered, disable self-update"
    status: approved
    description: >
      Self-hosted runners run under zwinger with the github-runner template. Measured on the CI
      host (2026-11-26, ss snapshots under load): 387 of 387 remote peers were on port 443, but
      sccache and Bazel servers listen on loopback ports, some ephemeral.
    decision: >
      network.mode = "unfiltered" for runners; the runner home read-only with listed writable
      directories; runners configured with --disableupdate and updated by redeploy.
    rationale: >
      Landlock ABI 4 filters TCP by port, not address: a rule that admits ephemeral loopback
      ports admits every remote port too, so a port list would claim a confinement it does not
      deliver. A self-updating runner needs its home writable, which would let a job replace
      Runner.Worker for every later job. Not protected, stated so it is not mistaken for
      coverage: the runner's own .runner and .credentials, which Runner.Listener reads and
      every job inherits access to.
    links:
      - type: satisfies
        target: REQ-ZW-009
      - type: satisfies
        target: REQ-ZW-010
      - type: satisfies
        target: REQ-ZW-011

  - id: VER-ZW-004
    type: verification
    title: "Release pipeline exercised on pull requests; signature verified as a consumer would"
    status: implemented
    method: test
    description: >
      .github/workflows/release.yml runs on pull requests that touch the release path: the
      version guard, both native musl builds, the static-binary check and the packaged-tarball
      smoke test (version, usage exit 2, refusal exit 78, a confined write inside and a refused
      read outside). On a tag it also signs the sums and verifies the signature with the
      identity consumers pin before uploading. tests/cli.rs checks --version, -V, --help and
      exit 2 for unknown flags and commands.
    links:
      - type: verifies
        target: REQ-ZW-012

  - id: DD-ZW-005
    type: design-decision
    title: "Release: synth's signed pipeline, static musl, Linux only for now"
    status: approved
    description: >
      release.yml follows pulseengine/synth's Track A pipeline (sums with SBOM and docs
      inside, SLSA provenance, cosign keyless) for x86_64 and aarch64 musl, each built natively
      so its smoke test executes the tarball it uploads.
    decision: >
      Ship static musl Linux binaries only; add macOS when its backend exists. The pipeline also
      runs on pull requests that touch the release path, without signing or publishing.
    rationale: >
      A confinement launcher should not depend on the host's dynamic loader or glibc version,
      and the consumers (CI runner hosts on Ubuntu 24.04, a Raspberry Pi) are Linux. A macOS
      binary today would only refuse to run. Exercising the pipeline on pull requests means a
      tag is not its first run. Not covered yet: crates.io and npm distribution (Cargo.toml has
      publish = false) and inclusion in a varve layer.
    links:
      - type: satisfies
        target: REQ-ZW-012

  - id: DD-ZW-006
    type: design-decision
    title: "Profiles are YAML, read by rivet-yaml"
    status: approved
    description: >
      Profile files are YAML, parsed with rivet-yaml (pinned by rivet release tag; Cargo.lock
      pins the commit), the parser that reads every rivet artifact file in the org.
    decision: >
      Use YAML and rivet-yaml for profiles instead of TOML. Constructs that could change a
      profile's meaning are refused: duplicate keys, tags, multiple documents, merge keys, and
      YAML 1.1 booleans (yes/on read as strings and fail against bool). A null name, which
      rivet-yaml reads as the text "~" (rivet#1354), is refused by validation.
    rationale: >
      One configuration format and one parser across pulseengine, matching rivet's artifacts.
      rivet-yaml is checked against the yaml-test-suite with zero cases read silently wrong,
      and it refuses what it cannot represent instead of guessing. It is not on crates.io yet,
      so zwinger cannot be published to crates.io until it is.
    links:
      - type: satisfies
        target: REQ-ZW-002
      - type: satisfies
        target: REQ-ZW-001

  - id: DD-ZW-008
    type: design-decision
    title: "noexec drops Landlock's execute right per grant, and refuses what a wider grant covers"
    status: approved
    description: >
      noexec is enforced with the rights given to each Landlock rule, not with a deny, because
      Landlock only grants.
    decision: >
      A grant at or beneath a noexec tree is added without AccessFs::Execute. A noexec tree
      strictly inside a wider grant is refused at plan time. A noexec tree that no grant reaches
      is accepted, because nothing there is executable anyway, and refusing it would break a
      profile on a host where an optional grant is absent.
    rationale: >
      Landlock adds rights along a path, so the only way to keep execve out of a tree is for
      every rule that covers it to lack Execute. That holds exactly when no grant strictly
      contains the tree, which is the rule the planner checks and the Kani harness proves.
      Refusing the other case keeps zwinger's rule that a profile is enforced as written or not
      at all.
    links:
      - type: satisfies
        target: REQ-ZW-013
  - id: DD-ZW-009
    type: design-decision
    title: "Events go to warte's probe as files in its state dir"
    status: approved
    description: >
      pulseengine/warte#223, option A (owner decision 2026-11-27): zwinger writes event files,
      and warte's probe collects them and ships them with its own identity, relay-ccsds framing
      and relay-sec sealing (later relay-bp store-and-forward, pulseengine/relay#626).
    decision: >
      One JSON file per run, mode 0600 in a 0700 directory, created before confinement and
      written through the open descriptor after it. Only the fields in warte#223's table. A
      refusal is reduced to its category, because refusal texts name paths.
    rationale: >
      zwinger then needs no token, network, retry logic or crypto of its own. The probe already
      collects the activity hook's files the same way, and an agent session keeps no network
      capability it would only need for reporting.
    links:
      - type: satisfies
        target: REQ-ZW-014

  - id: DD-ZW-010
    type: design-decision
    title: "The path rules are proven where they ship: verus! in the crate, Kani on the same code"
    status: approved
    description: >
      src/pathrules.rs holds within, the carve-out checker and the noexec checker inside verus!.
      A normal build erases specs and proofs and compiles the rest; profile::within and the
      linux checkers are thin wrappers over it.
    decision: >
      Prove the shipped functions, not a hand-written mirror. Depend on vstd
      (=0.0.0-2026-11-01-0251) in normal builds, paired with Verus 0.2026.11.02.8bf68ee in CI
      (archive pinned by sha256). Keep the Kani harnesses on the same wrappers, so CBMC and Z3
      each check one implementation.
    rationale: >
      A model that drifts from the code fools every prover identically. Proving the code itself
      removes the mirror, and two solvers with different trusted bases on one implementation do
      not share a blind spot. cargo-mutants cannot see inside verus!, so planted bugs in CI check
      that the proofs can fail.
    links:
      - type: satisfies
        target: REQ-ZW-008
      - type: satisfies
        target: REQ-ZW-013

  - id: VER-ZW-005
    type: verification
    title: "Kani proofs: seccomp program, profile-to-verdict, enforcement decisions"
    status: implemented
    method: analysis
    description: >
      cargo kani (Kani 0.68.0, CBMC 6.11), CI job "Kani proofs", 26 harnesses over the shipped
      code in src/linux.rs mod proofs. For x86_64 and aarch64 in all four socket modes, the
      seccomp program is well formed (every instruction in the emitted subset, every jump inside
      the program, a ret last) and its verdict equals seccomp_spec for every 32-bit audit_arch,
      nr, args[0] and args[1]. From any kernel ABI >= 3 and any network and UNIX-socket mode,
      the filter's verdict on socket(2) is the one the requirement text states. For every i32
      ABI, enforcement() refuses below 3, allows network sockets only under mode unfiltered and
      AF_UNIX only when Landlock confines it or the profile opts out, and never requests a
      Landlock right the ABI lacks. Inputs are symbolic over their full range; loop unwinding is
      bounded at 30 with unwinding assertions on. Eight planted-bug controls (TIOCSTI, TIOCLINUX,
      x32, io_uring, EPERM to allow, EACCES to allow, the arch check, the AF_UNIX test) must each
      fail (should_panic). cover! statements show every verdict is reachable. Trusted base:
      bpf_run (this repository's classic-BPF model; the kernel interpreter is checked by
      tests/linux.rs), the shared syscall constants, and Kani/CBMC. The spec was reviewed against
      REQ-ZW-005/006/009 by a separate reviewer before it was relied on.
      Carve-out rules (REQ-ZW-008): for normal-form paths, two ancestors of a path are nested
      (lemma), and if first_carve_violation accepts a profile then every path beneath a denied
      path stays uncovered by any write grant and by any read grant other than a read exception
      stated inside that deny_read, with stated and resolved paths varying independently; three
      planted-bug controls (deny_write rules dropped, read exception unconditional, deny under a
      grant unchecked) must fail. Their domain is normal paths of up to 4 bytes over {'/', 'a',
      'b'}; within() itself is checked against Path::starts_with (after normalize) for every pair
      of paths up to 5 bytes over {'/', 'a', 'b', '.'} by unit test.
      noexec rule (REQ-ZW-013): if first_noexec_violation accepts the grants, every grant that
      covers a path beneath a noexec tree has lost execute (may_exec is false), over the same
      path domain; one planted-bug control (the inside-grant rule dropped) must fail.
    links:
      - type: verifies
        target: REQ-ZW-008
      - type: verifies
        target: REQ-ZW-005
      - type: verifies
        target: REQ-ZW-006
      - type: verifies
        target: REQ-ZW-009
      - type: verifies
        target: REQ-ZW-013

  - id: VER-ZW-006
    type: verification
    title: "Verus proofs: path rules for paths of any length"
    status: implemented
    method: analysis
    description: >
      cargo verus verify (Verus 0.2026.11.02.8bf68ee, Z3), CI job "Verus proofs", 18 obligations
      in src/pathrules.rs over the shipped code. Proven: within_bytes equals spec_within for all
      byte strings. On normal paths (absolute, no trailing separator but the root), two ancestors
      of a path are nested and within is transitive. first_carve_violation_bytes returning None
      implies every compared pair is compatible, and lemma_carve_sound then gives REQ-ZW-008 for
      every path x of any length: beneath a deny_read no write grant covers x and a read grant
      covers it only as a stated exception, and beneath a deny_write no write grant covers x.
      first_noexec_violation_bytes returning None implies no noexec tree lies strictly inside a
      grant, and lemma_noexec_sound gives REQ-ZW-013: every grant covering a path beneath a noexec
      tree has lost execute (may_exec_bytes is false). Three planted bugs (the boundary test
      dropped, a deny_write check dropped, the noexec check dropped) must each fail verification
      in CI. Trusted base: Verus, Z3, vstd's slice and Seq axioms, and the wrappers' byte
      conversion (as_os_str().as_bytes(), unit-tested). The normal-form precondition holds
      because profile paths are normalized at parse and resolved paths come from canonicalize.
    links:
      - type: verifies
        target: REQ-ZW-008
      - type: verifies
        target: REQ-ZW-013

  - id: VER-ZW-001
    type: verification
    title: "Profile and CLI fail-closed tests"
    status: implemented
    method: test
    description: >
      src/profile.rs tests: missing file, unknown key, wrong type, missing or blank name, relative
      and '..' paths in each of the four path fields, write inside deny_read or deny_write, read
      equal to deny_read, non-exact hosts and Mach service names, and the refusal text.
      tests/cli.rs: check refuses a missing profile with 78; on platforms without a backend, run
      never executes the command. Mutation-tested with cargo-mutants in CI (mutants job, zero
      missed; equivalent mutants listed in .cargo/mutants.toml).
    links:
      - type: verifies
        target: REQ-ZW-001
      - type: verifies
        target: REQ-ZW-002

  - id: VER-ZW-002
    type: verification
    title: "Linux planner tests: ABI decisions, refusals, seccomp program"
    status: implemented
    method: test
    description: >
      src/linux.rs tests, which run on every platform: ABI 0..2 refused and the features of ABI
      3..10 switched on at their versions; missing granted paths, carve-outs, symlink aliasing in
      both directions, host lists and loopback binding refused; the seccomp program executed in a
      classic-BPF interpreter for x86_64 and aarch64 over socket families, io_uring, the TIOCSTI and
      TIOCLINUX ioctls against other ioctl requests, x32 and a foreign architecture, in all four
      socket-mode combinations; the network and UNIX-socket modes, skipped optional grants, the
      startup line, explain, and the runner template (refused unsubstituted, planned
      substituted). src/profile.rs and src/linux.rs are mutation-tested in CI with zero missed.
    links:
      - type: verifies
        target: REQ-ZW-009
      - type: verifies
        target: REQ-ZW-010
      - type: verifies
        target: REQ-ZW-011
      - type: verifies
        target: REQ-ZW-004
      - type: verifies
        target: REQ-ZW-005
      - type: verifies
        target: REQ-ZW-006
      - type: verifies
        target: REQ-ZW-008

  - id: VER-ZW-003
    type: verification
    title: "End-to-end confinement on CI kernels"
    status: implemented
    method: test
    description: >
      tests/linux.rs runs zwinger run on the CI runner's kernel (self-hosted x64, hosted
      aarch64) and probes the session: writes inside the write tree succeed; writes, truncation
      and reads outside it fail; an inherited descriptor does not leak; TCP and UDP egress,
      AF_INET, AF_INET6 and AF_NETLINK sockets and io_uring are refused; AF_UNIX follows the
      kernel ABI and a socket outside the profile is unreachable; unenforceable profiles exit 78
      without running the command; mode unfiltered allows TCP while paths and AF_UNIX stay
      confined; unix_sockets unfiltered reaches a socket outside the profile; the session sees
      ZWINGER_PROFILE and ZWINGER_ABI and the startup line names the ABI and skipped paths.
      Each refusal has an unconfined control that succeeds.
    links:
      - type: verifies
        target: REQ-ZW-009
      - type: verifies
        target: REQ-ZW-010
      - type: verifies
        target: REQ-ZW-004
      - type: verifies
        target: REQ-ZW-005
      - type: verifies
        target: REQ-ZW-006
      - type: verifies
        target: REQ-ZW-008
