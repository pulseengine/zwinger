      read again by the next run with the operator's full authority, so the session must not be
      able to change them.
    links:
      - type: constraint-satisfies
        target: SC-ZW-9

  - id: VER-ZW-012
    type: verification
    title: "A profile inside a write grant is refused; outside, it runs"
    status: implemented
    method: test
    description: >
      src/inputs.rs unit tests (inside refused, outside accepted; a symlink resolving inside and
      a symlink stated inside both refused; a second hard link refused; a profile swapped after it
      was read refused; the hash is of the bytes parsed). tests/cli.rs: check refuses a profile
      inside its own write grant and accepts the same profile outside it, and refuses zwinger
      invoked through a symlink inside a write grant while the same check by its own path passes.
      tests/linux.rs and tests/macos.rs: run refuses such a profile without running the command,
      and the same command runs when the profile lies outside the grant.
    links:
      - type: verifies
        target: REQ-ZW-024

  - id: DD-ZW-022
    type: design-decision
    title: "What the next run trusts is checked against the write grants before confinement"
    status: approved
    description: >
      Found in the STPA-Sec pass, 2026-11-27; shipped as a security fix.
    decision: >
      src/inputs.rs compares the profile file and std::env::current_exe() against every write
      and write_if_present entry, each stated and resolved, before anything is confined, the
      same way the events directory is checked. The profile must also have a single hard link.
      The executable gets no hard-link rule: build tools hard-link their outputs, and the
      session cannot create a cross-directory link (Landlock withholds REFER, Seatbelt refuses
      links to files it cannot read).
    rationale: >
      zwinger can only promise a session's bounds if the session cannot choose the bounds of the
      run after it. Refusing is fail-closed and needs no new kernel feature; the operator moves
      the file out of the grant.
    links:
      - type: satisfies
        target: REQ-ZW-024
  - id: REQ-ZW-022
    type: requirement
    title: "Code-injecting environment variables are removed before exec unless the profile keeps them"
    status: approved
    description: >
      zwinger removes a documented list of variables (dynamic-loader injection, shell startup
      files, build and VCS wrappers; src/env.rs) from the command's environment, and names what
      it removed on the startup line. env_keep keeps a listed variable; an env_keep entry that
      is not on the list is refused when the profile loads.

  - id: DD-ZW-021
    type: design-decision
    title: "zwinger scrubs a fixed list at exec, with env_keep, as a layer independent of kapsel"
    status: approved
    description: >
      Owner decision, 2026-11-27, over an allowlist-only environment and no scrub.
    decision: >
      A fixed list with exact names and the DYLD_ prefix, removed with Command::env_remove before
      exec. The profile's env_keep may only name listed variables.
    rationale: >
      An allowlist-only environment breaks agents and builds until every profile lists what they
      need. A fixed list removes the known code-injection channels while keeping ordinary
      variables. The limit is stated: the agent can set these for its own children, which stay
      confined by the kernel sandbox, and kapsel's host applies its own allowlist to native
      tools.
    links:
      - type: satisfies
        target: REQ-ZW-022

  - id: VER-ZW-010
    type: verification
    title: "Scrubbed variables are removed, kept ones and ordinary ones pass through"
    status: implemented
    method: test
    description: >
      src/env.rs unit tests (removal, env_keep, the DYLD_ prefix without lookalikes, case
      sensitivity, refusing an env_keep name not on the list); tests/cli.rs refuses env_keep:
      [PATH] at check; tests/linux.rs and tests/macos.rs run a confined env with scrubbed,
      kept and ordinary variables set and check its output and the startup line.
    links:
      - type: verifies
        target: REQ-ZW-022

  - id: REQ-ZW-026
    type: requirement
    title: "Linux: each Landlock rule holds the object the plan checked"
    status: approved
    description: >
      Each granted path is opened once for its Landlock rule, and zwinger refuses (exit 78) when
      the object opened is no longer at the path the plan resolved and checked: a symlink in its
      place, or a path that now resolves elsewhere. The rule is built from that descriptor.

  - id: DD-ZW-024
    type: design-decision
    title: "Rules are built from a descriptor whose path is read back and compared with the plan"
    status: approved
    description: >
      Found in the STPA-Sec review, 2026-11-27; shipped as a security fix.
    decision: >
      open_planned opens the canonical planned path with O_PATH and O_NOFOLLOW, refuses a symlink,
      reads the descriptor's path back through /proc/self/fd and refuses any difference from the
      plan, and hands the descriptor to Landlock's PathBeneath. Whether the grant is a directory is
      taken from the descriptor, not from the path.
    rationale: >
      The plan's checks (carve-outs, symlinks into denied trees) are about paths; between planning
      and installing a rule, a concurrent writer on the path could make it name another object.
      Reading the path back from the opened object closes that window without changing the plan,
      and the rule then follows the object checked.
    links:
      - type: satisfies
        target: REQ-ZW-026

  - id: VER-ZW-014
    type: verification
    title: "A path swapped between planning and confinement is refused"
    status: implemented
    method: test
    description: >
      src/linux.rs bind_tests (Linux): an unchanged planned path opens as a directory; the last
      component replaced by a symlink into a denied tree is refused; an earlier component replaced
      by a symlink, so the same path names an object in the denied tree, is refused with the new
      location named.
    links:
      - type: verifies
        target: REQ-ZW-026

  - id: REQ-ZW-025
    type: requirement
    title: "Linux: the session cannot use the kernel keyrings"
    status: approved
    description: >
      add_key, request_key and keyctl fail with EPERM in every network and socket mode, on
      every supported architecture. The kernel keyrings hold credentials no path rule covers.

  - id: DD-ZW-023
    type: design-decision
    title: "The keyring syscalls are refused by the seccomp filter, like io_uring"
    status: approved
    description: >
      Found in the STPA-Sec review, 2026-11-27; shipped as a security fix.
    decision: >
      Each architecture's table carries the three keyring syscall numbers (checked against libc
      for the target), the program refuses them with EPERM, and the specification seccomp_spec
      says so, so Kani proves the filter on x86_64, aarch64 and riscv64. A planted-bug control
      (keyctl not refused) must fail.
    rationale: >
      Landlock has no keyring right. Refusing in the filter needs no new kernel feature and is
      covered by the existing proof machinery; agents have no common need for the keyrings.
    links:
      - type: satisfies
        target: REQ-ZW-025

  - id: VER-ZW-013
    type: verification
    title: "Keyring syscalls refused: proof, unit tests, end to end"
    status: implemented
    method: test
    description: >
      Kani: the filter equals seccomp_spec (which refuses the keyring syscalls) on three
      architectures in every socket mode, and planted_keyctl_not_refused must fail. Unit tests:
      every_case checks the keyring numbers and their neighbours; the_native_table_matches_libc
      checks the numbers against libc. tests/linux.rs kernel_keyring_syscalls_are_refused: keyctl
      fails with EPERM under zwinger and succeeds unconfined.
    links:
      - type: verifies
        target: REQ-ZW-025

  - id: REQ-ZW-027
    type: requirement
    title: "A confined session connects to UNIX sockets only in the socket directories zwinger names"
    status: approved
    description: >
      While UNIX sockets are confined, the session may connect only to sockets in the
      per-session socket directory zwinger creates (ZWINGER_SOCKET_DIR) and in the profile's
      unix_socket_dirs. Sockets elsewhere, including inside write trees, cannot be connected to,
      though the session may still create sockets in its write trees. On Linux this uses
      Landlock's UNIX-connect right (ABI 9); below ABI 9, socket(AF_UNIX) stays refused under
      mode none. On macOS it uses Seatbelt's outbound rules. zwinger check lists sockets that
      already exist in write trees.

  - id: DD-ZW-025
    type: design-decision
    title: "UNIX-socket connect is granted to named directories, not to write trees"
    status: approved
    description: >
      Owner decision, 2026-11-27 (option B over a plan-time socket list, A, which stays as a check
      warning). Found in the STPA-Sec review; shipped as a security fix.
    decision: >
      Linux: write trees keep every right except ResolveUnix; the per-session directory gets the
      write rights plus ResolveUnix, and each unix_socket_dirs entry gets ResolveUnix alone.
      macOS: write trees allow network-bind only; network-outbound is allowed in the per-session
      directory and in unix_socket_dirs. src/sockets.rs creates the per-session directory (0700,
      short name for macOS's 104-byte socket paths) before confinement, outside every write grant,
      and on Linux it gets no right to receive renamed or linked files (no Landlock Refer), so a
      foreign socket cannot be moved in from a write tree and connected there. On macOS bind()
      needs file-write-create, so the directory allows creating and unlinking sockets only (no
      regular file, directory or hard link); Seatbelt checks a rename's target as the same right,
      so there a socket already in a write tree can be renamed in. tests/macos_sockdir.rs measures
      both and asserts the residual, and docs/profile.md states it.
    rationale: >
      A socket in a write tree can belong to a server outside the session, which then acts for
      it with its own authority. Attaching the connect right to directories closes this whatever
      the order in which servers start; a socket list taken at plan time would miss a server that
      starts later. Tools that use their own server socket in a write tree name that directory.
    links:
      - type: satisfies
        target: REQ-ZW-027

  - id: VER-ZW-015
    type: verification
    title: "Sockets in write trees refuse connect; socket directories allow it"
    status: implemented
    method: test
    description: >
      tests/macos.rs unix_sockets_connect_only_in_socket_directories and
      unfiltered_network_keeps_unix_sockets_confined: a socket in a write tree is refused
      (EPERM) while the unconfined control connects; binding in a write tree works; the session's
      own socket in ZWINGER_SOCKET_DIR connects; a socket in a listed unix_socket_dirs entry
      connects. tests/linux.rs unix_sockets_connect_only_in_socket_directories does the same at
      Landlock ABI 9. No CI kernel is at ABI 9 yet, so on Linux the connect restriction is verified
      only on macOS until zwinger#41 adds such a job; unix_sockets_follow_the_kernel_abi covers
      AF_UNIX being refused below ABI 9. Unit tests: the macOS policy rules, the session
      directory (created outside every write grant), the bounded socket listing.
    links:
      - type: verifies
        target: REQ-ZW-027
