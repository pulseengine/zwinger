# zwinger profile for one self-hosted GitHub Actions runner on Linux (Landlock ABI >= 3).
#
# Template: replace every {{home}} with the runner's home, e.g. /var/lib/runners/runner19. An
# unsubstituted file fails `zwinger check` ("{{home}}/_work is not absolute"), so a missed
# substitution cannot run. The entries stay quoted: an unquoted {{home}} would be a YAML flow
# mapping, and quoting keeps the substituted paths plain strings.
#
# systemd drop-in. run.sh copies run-helper.sh into the home on every start, and the home is
# read-only under this profile, so the copy runs before zwinger, unconfined, and zwinger runs
# run-helper.sh. A job cannot plant what the next start copies: the template is in the home.
#   ExecStartPre=/bin/cp -f {{home}}/run-helper.sh.template {{home}}/run-helper.sh
#   ExecStart=/usr/local/bin/zwinger run /etc/zwinger/runnerN.yaml -- {{home}}/run-helper.sh
#   Environment=ZWINGER_EVENTS_DIR=/var/lib/zwinger/events/runnerN
#   Environment=HOME={{home}}/_home
# Before moving HOME, pin every tool home that defaults under $HOME to its existing directory
# in the real home (RUSTUP_HOME, CARGO_HOME, XDG_CACHE_HOME, npm_config_cache and the like),
# so caches and per-runner state stay where the write_if_present grants below point; an
# unpinned one silently moves into the empty _home.
#   StartLimitIntervalSec=300
#   StartLimitBurst=5
# With --disableupdate, run.sh's loop restarts only on run-helper.sh exit 2, which Restart=always
# covers. A fatal start exits 0, so the start limit makes a profile gap fail the unit instead of
# restarting forever. ZWINGER_EVENTS_DIR must lie outside every write grant (the default,
# {{home}}/.local/state/warte/zwinger, is inside the .local grant below); create it owned by the
# runner user, mode 0700. zwinger execs, so run-helper.sh stays the unit's main PID. Rollback:
# drop the drop-in and restart the unit.
#
# What this confines: paths. Jobs can read the system trees and the runner's home, and write
# only the work, temp, log and cache directories below. The home itself is read-only, so a job
# cannot replace bin/Runner.Worker or run.sh for later jobs. That requires the runner to be
# configured with --disableupdate and updated by redeploy.
#
# What it does not confine:
# - directory names: the runner checks that it can list its root and every directory above it,
#   and Landlock's listing right covers a directory and everything beneath it, so `list: ["/"]`
#   lets jobs list directory names anywhere the runner user's permissions allow. No file
#   becomes readable through it. Other runners' homes stay closed only by their Unix mode, and
#   that mode is the deployment's to enforce, not zwinger's (next item);
# - jobs' $HOME: HOME={{home}}/_home is writable and lasts across jobs, like the caches; a fresh
#   HOME per job is the stronger setup;
# - file modes and owners: Landlock does not restrict chmod, chown or other metadata changes, so
#   a job can loosen the mode of anything its user owns, its read-only home included. Make each
#   home owned by root (e.g. root:runnerN 0750, with the write directories owned by the runner
#   user), so the runner user cannot change it;
# - file metadata (stat): Landlock never restricts it, with or without list; it stays visible
#   wherever the runner user may traverse, as before;
# - the network (mode: unfiltered): sccache and Bazel use loopback ports and Landlock filters
#   by port, not address, so any port rule that admits them admits remote ones too;
# - the runner's own .runner and .credentials: Runner.Listener reads them, and every job
#   inherits the Listener's confinement;
# - at ABI 4 (Linux 6.8): device ioctls (ABI 5) and signals to the runner's own processes
#   (ABI 6). Other users' processes are out of reach anyway.
#
# A denial shows up as EACCES from open/creat/mkdir/unlink/truncate (EXDEV for a rename or link
# across directories). `zwinger explain <this file> <path>` names the rule that decides a path.

name: github-runner

# Listing only, for the runner's check of its root's ancestors (see above).
list:
  - "/"

read:
  - "/usr"
  - "/etc"
  - "/proc"
  - "/sys"
  - "/dev"
  - "{{home}}"

read_if_present:
  - "/opt"
  - "/lib"
  - "/lib64"
  - "/lib32"
  - "/libx32"
  # /etc/resolv.conf links here on Ubuntu; Landlock checks the link's target.
  - "/run/systemd/resolve"
  # Toolchains outside {{home}} must be added here. If the runner's PATH, CARGO_HOME,
  # RUSTUP_HOME or ELAN_HOME point at a shared install elsewhere (another user's ~/.cargo,
  # ~/.rustup, ~/.elan), add those directories, or rustc and cargo fail with "Permission
  # denied" under confinement. `zwinger explain <profile> <path>` shows which rule decides.

write:
  - "{{home}}/_work"
  - "{{home}}/_tmp"
  - "{{home}}/_diag"
  # Jobs' $HOME (Environment=HOME= in the drop-in): tools write ~/.sigstore, ~/.cosign,
  # ~/.ssh and more, and the home itself is read-only. Create it, owned by the runner user.
  - "{{home}}/_home"
  - "/tmp"
  - "/dev/null"

# Missing directories are skipped, and a job cannot create them later (the home is read-only):
# create every cache directory a runner should have before starting the unit.
write_if_present:
  - "{{home}}/.cache"
  - "{{home}}/.cargo"
  - "{{home}}/.rustup"
  - "{{home}}/.bazel"
  - "{{home}}/.npm"
  - "{{home}}/.bun"
  - "{{home}}/.local"
  - "{{home}}/.kani"
  - "{{home}}/.varve"

network:
  mode: unfiltered
