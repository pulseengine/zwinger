name: CI

on:
  push:
    branches: [main]
  # every pull request and the merge queue: no paths or branch filter on a workflow that hosts
  # required checks
  pull_request:
  merge_group:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# A new push to a PR cancels that PR's older runs; pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_TOOLCHAIN: 1.99.1
  # rivet v0.41.1, the rivet in the varve layer pinned by varve.toml (2026.11.10).
  RIVET_REV: 29ca43828c8060af135fcd47ecff4c48662d1567
  # spar v0.49.0, the spar in the same varve layer.
  SPAR_REV: da271e963955c97eae59dc1884a3ffb34142da39
  CARGO_MUTANTS_VERSION: 27.0.0
  KANI_VERSION: 0.68.0
  # Verus release (Z3 bundled) and the sha256 of its x86-linux archive. vstd in Cargo.toml is
  # pinned to the matching build (0.0.0-2026-11-01-0251).
  VERUS_RELEASE: 0.2026.11.02.8bf68ee
  VERUS_SHA256: f3a0119292df8855e4435da8130bee1873b0e6a60c306accf81a08ea687bba3c

jobs:
  linux:
    # The confinement tests (tests/linux.rs) run here against the runner's real kernel: zwinger
    # applies Landlock and seccomp and execs probes that must be refused. On a kernel without
    # Landlock ABI 3 they fail, by design.
    name: Linux confinement (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fork PRs go to a hosted runner. Routing is not a security boundary; the org's
          # runner-group policy and fork-PR approval are.
          - name: self-hosted x64
            runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","rust-cpu"]' || '"ubuntu-24.04"' }}
          # aarch64: the seccomp syscall table zwinger ships for the Raspberry Pi target.
          - name: hosted aarch64
            runs-on: '"ubuntu-24.04-arm"'
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Kernel under test
        run: |
          uname -srm
          cat /sys/kernel/security/lsm 2>/dev/null && echo || echo "(lsm list not readable)"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; toolchain pinned below
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests (unit, CLI, end-to-end confinement)
        run: cargo test --locked --no-fail-fast

      - name: Confine a process and show the refusals
        run: |
          set -euo pipefail
          cargo build --locked
          work="$(mktemp -d)"
          secret="$(mktemp -d)"
          echo secret > "$secret/token"
          cat > "$work/profile.yaml" <<EOF
          name: ci-smoke
          read: ["/usr", "/etc"$( [ -e /lib64 ] && echo ', "/lib64"' )$( [ -e /lib ] && echo ', "/lib"' )]
          write: ["$work", "/dev/null"]
          EOF
          ./target/debug/zwinger check "$work/profile.yaml"
          ./target/debug/zwinger run "$work/profile.yaml" -- /usr/bin/bash -c "
            touch '$work/inside' && echo 'write inside: ok'
            if cat '$secret/token' 2>/dev/null; then echo 'read outside: NOT REFUSED'; exit 1; fi
            echo 'read outside: refused'
          "

  macos:
    # The Seatbelt prototype (src/macos.rs, REQ-ZW-003, DD-ZW-007) on a hosted macOS runner:
    # tests/macos.rs makes zwinger apply its policy with sandbox_init and exec probes that must
    # be refused. sandbox_init cannot be nested, so this cannot run inside another sandbox.
    name: macOS confinement (seatbelt)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: OS under test
        run: |
          sw_vers
          uname -srm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; toolchain pinned below
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests (unit, CLI, end-to-end confinement)
        run: cargo test --locked --no-fail-fast

      # A confined process that dies leaves its reason in the unified log (Seatbelt denials) and
      # in a crash report, not in the test output.
      - name: Seatbelt denials and crash reports (on failure)
        if: failure()
        run: |
          log show --last 15m --style compact --predicate 'sender == "Sandbox"' | grep -F 'deny' | tail -200 || true
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -20 || true
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -3); do
            echo "== $f"; head -c 4000 "$f"; echo
          done

      - name: Confine a process and show the refusals
        run: |
          set -euo pipefail
          cargo build --locked
          work="$(mktemp -d)"; ro="$(mktemp -d)"; secret="$(mktemp -d)"
          echo secret > "$secret/token"
          echo public > "$ro/public"; mkdir "$ro/private"; echo key > "$ro/private/key"
          cat > "$work/profile.yaml" <<EOF
          name: ci-smoke
          read: ["/usr", "/bin", "$ro"]
          write: ["$work", "/dev/null"]
          deny_read: ["$ro/private"]
          EOF
          ./target/debug/zwinger check "$work/profile.yaml"
          ./target/debug/zwinger run "$work/profile.yaml" -- /bin/bash -c "
            /usr/bin/touch '$work/inside' && echo 'write inside: ok'
            if /bin/cat '$secret/token' 2>/dev/null; then echo 'read outside: NOT REFUSED'; exit 1; fi
            echo 'read outside: refused'
            /bin/cat '$ro/public' > /dev/null && echo 'read grant: ok'
            if /bin/cat '$ro/private/key' 2>/dev/null; then echo 'deny_read: NOT REFUSED'; exit 1; fi
            echo 'deny_read inside a read-only grant: refused'
          "
          # A carve-out inside a write tree could be renamed away, so the profile is refused.
          printf 'name: ci-smoke\nwrite: ["%s"]\ndeny_write: ["%s/locked"]\n' "$work" "$work" \
            > "$work/carve.yaml"
          set +e; ./target/debug/zwinger check "$work/carve.yaml"; rc=$?; set -e
          test "$rc" = 78 && echo 'deny_write inside a write tree: profile refused (78)'

  rivet:
    name: Rivet traceability
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; toolchain pinned below
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache rivet binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rivet
          key: rivet-${{ runner.os }}-${{ runner.arch }}-${{ env.RIVET_REV }}

      # Job-scoped install: never trust a rivet left in $HOME by an earlier job on a persistent
      # runner.
      - name: Install rivet (pinned rev, job-scoped)
        env:
          RUSTFLAGS: ""
        run: |
          ROOT="$RUNNER_TEMP/rivet"
          if [ ! -x "$ROOT/bin/rivet" ]; then
            cargo install --locked --git https://github.com/pulseengine/rivet \
              --rev "$RIVET_REV" --root "$ROOT" --bin rivet rivet-cli
          fi
          v="$("$ROOT/bin/rivet" --version)"
          echo "$v"
          [[ "$v" == "rivet 0.41.1 (${RIVET_REV:0:8}"* ]]
          echo "$ROOT/bin" >> "$GITHUB_PATH"

      - name: Validate artifacts
        run: rivet validate

      - name: Links have their inverses
        run: rivet check bidirectional

      # Requirement verification is 16 of 20 (2026-11-27): REQ-ZW-003 (the Endpoint Security
      # client) waits for the VM, and its Seatbelt stepping stone is REQ-ZW-015; REQ-ZW-007 (Pi
      # kernel) has no verification yet; REQ-ZW-017 (generated peers) waits for zwinger#14 and
      # spar 0.50; REQ-ZW-020 (WASM shell) is design only.
      # Raise this as they land.
      - name: Requirement verification coverage
        run: rivet coverage --fail-under 93 --strict-empty

  architecture:
    name: Architecture model (spar)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; toolchain pinned below
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache spar binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/spar
          key: spar-${{ runner.os }}-${{ runner.arch }}-${{ env.SPAR_REV }}

      # Job-scoped, like rivet: never trust a spar left in $HOME on a persistent runner.
      - name: Install spar (pinned rev, job-scoped)
        env:
          RUSTFLAGS: ""
        run: |
          ROOT="$RUNNER_TEMP/spar"
          if [ ! -x "$ROOT/bin/spar" ]; then
            cargo install --locked --git https://github.com/pulseengine/spar \
              --rev "$SPAR_REV" --root "$ROOT" --bin spar spar
          fi
          v="$("$ROOT/bin/spar" --version)"
          echo "$v"
          [[ "$v" == "spar 0.49.0" ]]
          echo "$ROOT/bin" >> "$GITHUB_PATH"
          jq --version

      - name: Model gate (fail-closed, telemetry, WCTT)
        run: architecture/check.sh

      # tests/lifecycle.rs holds the binary to this export; it must be the model's own.
      - name: The committed lifecycle export equals the model
        run: |
          spar modes --root Zwinger::Node.Confined --format smv architecture/zwinger.aadl \
            > "$RUNNER_TEMP/lifecycle.smv"
          diff -u architecture/expected/lifecycle.smv "$RUNNER_TEMP/lifecycle.smv"

      # Each planted model must fail the gate, or the gate measures nothing.
      - name: Planted models are rejected
        run: |
          set -u
          plant() {
            local d="$RUNNER_TEMP/planted-$1"
            rm -rf "$d"; mkdir -p "$d"; cp architecture/*.aadl "$d/"
            echo "$d"
          }
          d="$(plant commission)"
          perl -0pi -e 's/(        events_out : out propagation \{ServiceOmission\};\n)/$1        access_out : out propagation {ItemCommission};\n/; s/(        event_lost   : error source events_out \{ServiceOmission\};.*\n)/$1        leak : error source access_out {ItemCommission};\n/' "$d/zwinger.aadl"
          grep -q 'leak : error source access_out' "$d/zwinger.aadl"
          if architecture/check.sh "$d"; then echo "::error::planted ItemCommission passed"; exit 1; fi
          d="$(plant nobound)"
          perl -0pi -e 's/      Spar_Network::Switch_Type        => FIFO;\n//' "$d/reference_mesh.aadl"
          if grep -q Switch_Type "$d/reference_mesh.aadl"; then echo "::error::plant failed"; exit 1; fi
          if architecture/check.sh "$d"; then echo "::error::model without a switch passed"; exit 1; fi
          d="$(plant telemetry)"
          perl -0pi -e 's/        event_lost   : error source events_out \{ServiceOmission\};.*\n//; s/        events_out : out propagation \{ServiceOmission\};\n//' "$d/zwinger.aadl"
          if grep -q event_lost "$d/zwinger.aadl"; then echo "::error::plant failed"; exit 1; fi
          if architecture/check.sh "$d"; then echo "::error::model without event loss passed"; exit 1; fi
          d="$(plant revive)"
          perl -0pi -e 's/(      run_noexec : confined -\[exec_failed\]-> exited;\n)/$1      revive     : refused -[preflight_ok]-> confined;\n/' "$d/zwinger.aadl"
          grep -q 'revive     : refused' "$d/zwinger.aadl"
          if architecture/check.sh "$d"; then echo "::error::a refused session becoming confined passed"; exit 1; fi
          d="$(plant skip)"
          perl -0pi -e 's/(      run_noexec : confined -\[exec_failed\]-> exited;\n)/$1      skip       : loading -[preflight_ok]-> confined;\n/' "$d/zwinger.aadl"
          grep -q 'skip       : loading' "$d/zwinger.aadl"
          if architecture/check.sh "$d"; then echo "::error::confining without preflight passed"; exit 1; fi
          echo "all five planted models rejected"

  mutants:
    # The profile parser, the Linux planner (refusals, ABI decisions, seccomp program) and the
    # macOS planner and Seatbelt policy generator with zero missed mutants.
    # Exclusions and their reasons are in .cargo/mutants.toml.
    name: cargo mutants (parser + planner)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; toolchain pinned below
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mutants

      - name: Cache cargo-mutants binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-mutants
          key: cargo-mutants-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_MUTANTS_VERSION }}

      - name: Install cargo-mutants (pinned, job-scoped)
        env:
          RUSTFLAGS: ""
        run: |
          ROOT="$RUNNER_TEMP/cargo-mutants"
          if [ ! -x "$ROOT/bin/cargo-mutants" ]; then
            cargo install --locked --root "$ROOT" cargo-mutants --version "$CARGO_MUTANTS_VERSION"
          fi
          v="$("$ROOT/bin/cargo-mutants" mutants --version)"
          echo "$v"
          [[ "$v" == "cargo-mutants $CARGO_MUTANTS_VERSION" ]]
          echo "$ROOT/bin" >> "$GITHUB_PATH"

      # Fails on any missed or timed-out mutant; a run that tests nothing is also a failure.
      - name: Mutate
        run: |
          set -o pipefail
          cargo mutants --no-shuffle -j 2 -f src/profile.rs -f src/linux.rs -f src/events.rs -f src/macos.rs | tee mutants.log
          grep -Eq '^[1-9][0-9]* mutants tested' mutants.log

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: ignore

  kani:
    # Machine-checked proofs (src/linux.rs, mod proofs): the seccomp program equals its spec for
    # every syscall input on x86_64, aarch64 and riscv64 in all four socket modes; the program is well
    # formed; enforcement() never opens a channel the profile did not state; twelve planted bugs
    # must each be rejected (should_panic), or the job fails. Hosted runner: the action installs
    # Kani and CBMC.
    name: Kani proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; Kani brings its own nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Kani ${{ env.KANI_VERSION }}
        env:
          RUSTFLAGS: ""
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
          # Capture, then compare: `| grep -q` exits on the first match and the writer dies of
          # SIGPIPE under pipefail.
          v="$(cargo kani --version)"
          echo "$v"
          [[ "$v" == "Kani Rust Verifier $KANI_VERSION "* ]]

      # Every harness, then the summary: zero failures, and at least as many harnesses as exist
      # today (31), so a deleted or cfg-ed out harness is a red job, not a quieter green one.
      - name: Kani (every harness)
        run: |
          set -o pipefail
          # Terse output, unfiltered: a failure before the summary must show its error here.
          # RUSTFLAGS is unset, not empty: Kani 0.68.0 passes an empty RUSTFLAGS to its compiler
          # as an empty file name ("multiple input filenames provided").
          env -u RUSTFLAGS cargo kani --output-format terse 2>&1 | tee kani.log
          summary="$(grep -E "^Complete - [0-9]+ successfully verified harnesses, 0 failures, [0-9]+ total\.$" kani.log)"
          echo "$summary"
          total="$(echo "$summary" | sed -E 's/.* ([0-9]+) total\./\1/')"
          test "$total" -ge 31

  riscv64:
    # riscv64 (zwinger#23): the crate builds and lints for the target, and the library tests run
    # under qemu user mode, including the check of the riscv64 syscall table against libc's
    # numbers. The end-to-end tests need a riscv64 kernel (qemu user mode forwards syscalls to
    # the host's), which is #23 step 4.
    name: riscv64 (build, unit tests under qemu-user)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER: qemu-riscv64 -L /usr/riscv64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; toolchain pinned below
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: riscv64gc-unknown-linux-gnu
          components: clippy

      - name: Cross linker and qemu-user
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user
          qemu-riscv64 --version

      - name: Clippy (riscv64)
        run: cargo clippy --locked --target riscv64gc-unknown-linux-gnu --all-targets -- -D warnings

      - name: Library tests under qemu-riscv64
        run: |
          set -o pipefail
          cargo test --locked --target riscv64gc-unknown-linux-gnu --lib 2>&1 | tee riscv.log
          # The table check must have run on this target, not been filtered or cfg-ed away.
          grep -q "the_native_table_matches_libc ... ok" riscv.log
          grep -q "seccomp_program_riscv64 ... ok" riscv.log

  verus:
    # Verus (Z3) proves the path rules in src/pathrules.rs for paths of any length: within_bytes
    # computes its spec, ancestors of a path are nested, and the carve-out and noexec checkers
    # are sound. Kani checks the same shipped functions for short paths with CBMC.
    name: Verus proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; toolchain pinned below
        with:
          # Verus checks that the toolchain it was built for is installed.
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Verus ${{ env.VERUS_RELEASE }} (sha256-checked)
        run: |
          set -euo pipefail
          zip="verus-${VERUS_RELEASE}-x86-linux.zip"
          curl -fsSL -o "$RUNNER_TEMP/$zip" \
            "https://github.com/verus-lang/verus/releases/download/release/${VERUS_RELEASE}/$zip"
          echo "${VERUS_SHA256}  $RUNNER_TEMP/$zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/verus-x86-linux" >> "$GITHUB_PATH"

      # The first results line is vstd's own; zwinger's follows its "Checking zwinger" line. A
      # run that never verified zwinger (a missing [package.metadata.verus] or a cached check)
      # prints no such line and fails here, and fewer obligations than today (18) fail too.
      - name: Verus (zwinger's crate)
        env:
          CARGO_TARGET_DIR: target/verus
          # Plain output: colour codes between "Checking" and the crate name break the match.
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo verus verify 2>&1 | tee verus.log
          line="$(awk '/Checking zwinger /{f=1} f && /^verification results::/{print; exit}' verus.log)"
          echo "zwinger: $line"
          [[ "$line" =~ ^verification\ results::\ ([0-9]+)\ verified,\ 0\ errors$ ]]
          test "${BASH_REMATCH[1]}" -ge 18

      # cargo-mutants cannot see code inside verus!, so the proofs' potency is checked here:
      # each planted bug must apply and then fail verification with a proof error.
      - name: Verus planted bugs (each must be rejected)
        env:
          CARGO_TARGET_DIR: target/verus
          CARGO_TERM_COLOR: never
        run: |
          set -uo pipefail
          bak="$RUNNER_TEMP/pathrules.rs.bak"
          plant() {
            cp src/pathrules.rs "$bak"
            perl -0pi -e "$1" src/pathrules.rs
            if cmp -s src/pathrules.rs "$bak"; then echo "planted bug did not apply: $2"; exit 1; fi
            if cargo verus verify > "$RUNNER_TEMP/planted.log" 2>&1; then
              cp "$bak" src/pathrules.rs; echo "planted bug VERIFIED (proof is vacuous): $2"; exit 1
            fi
            grep -qE '^error: (postcondition|invariant|assertion)' "$RUNNER_TEMP/planted.log" \
              || { cp "$bak" src/pathrules.rs; echo "planted bug failed for another reason: $2"; tail -20 "$RUNNER_TEMP/planted.log"; exit 1; }
            cp "$bak" src/pathrules.rs
            echo "rejected as required: $2"
          }
          plant 's/inner\.len\(\) == outer\.len\(\) \|\| inner\[outer\.len\(\)\] == b\x27\/\x27\n\}/true\n}/' \
            "within_bytes ignores the component boundary"
          plant 's/            if within_bytes\(g\.resolved, d\.resolved\) \{\n                return Some\(Violation \{ deny_inside_grant: false, deny_write: true,[^\n]*\n            \}\n//' \
            "carve-out checker misses a write grant inside a deny_write"
          plant 's/            if within_bytes\(noexec\[n\], grants\[g\]\) && !within_bytes\(grants\[g\], noexec\[n\]\) \{\n                return Some\(\(n, g\)\);\n            \}\n//' \
            "noexec checker accepts a tree inside a wider grant"
